apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: collectl
  namespace: collectl
  labels:
    app: collectl
spec:
  selector:
    matchLabels:
      app: collectl
  template:
    metadata:
      labels:
        app: collectl
    spec:
      # these toleration are to have the daemonset runnable on control plane nodes
      # Uncomment them if you want control plane nodes to run DS pods
      #tolerations:
      #- key: node-role.kubernetes.io/master
      #  operator: Exists
      #  effect: NoSchedule
      nodeSelector:
        collectl: "true"
      containers:
      - name: collectl
        image: quay.io/acancell-redhat/ocp_collectl_cpu:4.3.20-ubi9
        imagePullPolicy: Always
        resources:
          limits:
            memory: 400Mi
          requests:
            cpu: 100m
            memory: 400Mi
        volumeMounts:
        - mountPath: /dev/mem
          name: mem
        - mountPath: /sys
          name: sys
        - mountPath: /var/log
          name: logs
        - mountPath: /etc/collectl.conf 
          name: conf
          subPath: collectl.conf
        securityContext:
          runAsUser: 0
          privileged: true
      volumes:
      - name: mem
        hostPath:
          path: /dev/mem
          type: CharDevice
      - name: sys
        hostPath:
          path: /sys
          type: Directory
      - name: logs
        hostPath:
          path: /var/log
          type: Directory
      - name: conf
        configMap:
          name: collectl-conf
      hostPID: true
      hostNetwork: true
      hostIPC: true