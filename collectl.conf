# /etc/collectl.conf
# For CPU Telemetry

# ==============================================================================
# -f /var/log/collectl : Output directory for raw binary logs
# -r00:00,7            : Daily rotation at midnight, retain 7 days of logs
# -m                   : Capture system hardware/OS metadata in file headers
# -F60                 : Buffer telemetry in memory; flush to disk every 60s
# -s cZj               : Subsystems -> (c) Per-core CPU, (Z) Processes/Threads,
#                                      (j) Hardware/Software Interrupts
# -i 1                 : High-resolution 1-second sampling cadence
# --top 50             : Limit process table logging to top 50 CPU consumers
# --procopts tw        : (t) Track thread LWPs/TIDs, (w) Full command line
# ==============================================================================
DaemonCommands = -f /var/log/collectl -r00:00,7 -m -F60 -s cZj -i 1 --top 50 --procopts tw

# Ignore background idle kernel workers to preserve top-50 slots for real workloads
ProcessFilter = kworker

# Global fallbacks required by the collectl binary
PQuery = /usr/sbin/perfquery:/usr/bin/perfquery:/usr/local/ofed/bin/perfquery
Interval = 10