# ==============================================================================
# OPTIMIZED OPENSHIFT TELEMETRY CONFIGURATION: CPU & OVS PROFILE
# Location: /etc/collectl.conf
# Target: High-Resolution Host, Container, & OVS CPU Telemetry
# ==============================================================================

# ------------------------------------------------------------------------------
# DAEMON RUNTIME COMMANDS (Injected via Entrypoint $ARGS wrapper)
# ------------------------------------------------------------------------------
# IMPORTANT: The collectl binary ignores 'DaemonCommands' unless managed by 
# a standard Linux init system (like systemd). Since this runs in a Kubernetes 
# pod, our custom entrypoint bash script greps this line, extracts the values, 
# and passes them directly to the binary as command-line arguments ($ARGS).
#
# FLAGS BREAKDOWN:
# -f /var/log/collectl : Directs raw binary telemetry logging to host directory
# -r00:00,7            : Daily rotation at 00:00 UTC, retains exactly 7 days
# -m                   : Embeds CPU topology, NUMA layout, and OS metadata in log headers
# -F60                 : Buffers logs in memory; flushes to storage every 60 seconds
#
# SUBSYSTEM DEFINITIONS (-s):
#   c : Per-Core CPU utilization (User, System, Nice, Idle, Wait, IRQ, SoftIRQ, Steal)
#   Z : Process-level CPU accounting (attaches CPU utilization to specific PIDs)
#   j : Hardware and Software Interrupt distribution per CPU core
#
# SAMPLING & ATTRIBUTION TUNING:
#   -i 1          : 1-second collection resolution
#   --top c50     : Tracks top 50 CPU consumers per sample to preserve OVS/OVN visibility
#   --procopts tw : Tracks threads (LWPs) and full command lines for thread distribution
# ------------------------------------------------------------------------------
DaemonCommands = -f /var/log/collectl -r00:00,7 -m -F60 -s cZj -i 1 --top c50 --procopts tw

# ------------------------------------------------------------------------------
# KERNEL THREAD FILTERING (Natively Parsed by collectl)
# ------------------------------------------------------------------------------
# NOTE: Unlike DaemonCommands, the binary natively reads these variables directly 
# on startup. This filters out idle or high-frequency kernel threads from 
# occupying the top 50 process slots, ensuring maximum visibility into CRI-O, 
# kubelet, and workloads.
# ------------------------------------------------------------------------------
ProcessFilter = kworker|rcu_|ksoftirqd|migration|cpuhp

# ------------------------------------------------------------------------------
# SYSTEM PATH FALLBACKS & DEFAULTS (Natively Parsed by collectl)
# ------------------------------------------------------------------------------
PQuery = /usr/sbin/perfquery:/usr/bin/perfquery:/usr/local/ofed/bin/perfquery
Interval = 10